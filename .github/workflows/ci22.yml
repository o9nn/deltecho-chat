name: CI22

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Live required checks run here. `.github/workflows/ci.yml` is disabled_manually.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Cubism/AIRI interchange contract
        run: python3 -m unittest discover -s scripts -p 'test_cubism_airi_interchange.py' -v

      - name: Use Python for original DTE ArtMesh source tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original DTE mesh authoring test dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/dte-avatar-design/requirements-mesh.txt

      - name: DTE original avatar authoring blueprints
        run: python3 -m unittest discover -s tools/dte-avatar-design -p 'test_*.py' -v

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        env:
          # Browser/e2e CI never launches Electron; skip the postinstall CDN.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Check preview Durable Object namespace
        run: node scripts/check-cloudflare-preview-namespace.mjs

      - name: Build Workspace Dependencies
        run: |
          # Build workspace packages in dependency order so check:types
          # can resolve cross-package type declarations via symlinks.
          pnpm --filter=deep-tree-echo-core build
          pnpm --filter=@deltecho/sys6-triality build
          pnpm --filter=@deltecho/dove9 build
          pnpm --filter=@deltecho/ipc build
          pnpm --filter=@deltecho/cognitive build
          pnpm --filter=@deltecho/avatar build
          pnpm --filter=deep-tree-echo-orchestrator build

      - name: Check (Lint, Types, Format)
        run: pnpm check

      - name: Unit Tests
        timeout-minutes: 30
        run: pnpm test

      - name: AIRI localhost broker
        run: |
          pnpm --filter @deltecho/airi-broker check:types
          pnpm --filter @deltecho/airi-broker test

      - name: Build for E2E
        run: pnpm build:browser

      - name: Install Playwright Browsers
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
        working-directory: packages/e2e-tests

      - name: Run E2E Tests
        timeout-minutes: 10
        run: pnpm --filter=e2e-tests e2e:ci
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e-tests/playwright-report/
          retention-days: 30

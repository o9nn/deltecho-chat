name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: "pnpm"  # Disabled for fresh builds

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Browser Target
        run: pnpm build:browser

      - name: Prepare static-safe Pages preview
        run: |
          mkdir -p packages/target-browser/pages-dist
          cp -R packages/target-browser/dist/. packages/target-browser/pages-dist/
          cp packages/target-browser/static-pages/index.html packages/target-browser/pages-dist/index.html
          cp packages/target-browser/static-pages/index.html packages/target-browser/pages-dist/main.html
          printf '%s\n' 'Deep Tree Echo static-safe GitHub Pages preview' > packages/target-browser/pages-dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "packages/target-browser/pages-dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

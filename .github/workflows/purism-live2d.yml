name: Purism Live2D Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-purism-evaluator:
    name: Verify pinned Purism v1.1.0 evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify vendored evaluator and CC0 fixture geometry
        env:
          PURISM_CI_REPORT: artifacts/purism-live2d-report.json
        run: >-
          node --test --test-reporter=spec
          scripts/check-live2d-core-selection.test.mjs
          scripts/check-purism-models.test.mjs

      - name: Upload Purism evaluator report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: purism-live2d-report-${{ github.run_id }}
          path: artifacts/purism-live2d-report.json
          if-no-files-found: warn
          retention-days: 14

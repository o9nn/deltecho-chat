version: "3.8"

# Alternative Docker deployment for Lucy GGUF on CogCity
# Usage: docker compose up -d
# Requires: NVIDIA Container Toolkit installed

services:
  lucy:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    container_name: lucy-inference
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/models:/models:ro
      - ./system-prompt.txt:/etc/lucy/system-prompt.txt:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model /models/qwen2.5-7b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 99
      --ctx-size 131072
      --parallel 4
      --cont-batching
      --flash-attn
      --metrics
      --system-prompt-file /etc/lucy/system-prompt.txt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
